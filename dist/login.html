<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafePin - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module" crossorigin src="/assets/login-B6KYm253.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="/assets/firebase-C69I2x72.js">
  <link rel="modulepreload" crossorigin href="/assets/browser-Cx9Z-D_s.js">
  <link rel="modulepreload" crossorigin href="/assets/errorHandler-CxKsmf1R.js">
  <link rel="modulepreload" crossorigin href="/assets/auth.service-DmsMn_7m.js">
  <link rel="stylesheet" crossorigin href="/assets/auth-styles-CKdps9dl.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <h1>Authority Access Portal</h1>
            <p>Sign in or create an account</p>
        </div>
        
        <div class="auth-tabs">
            <button class="auth-tab active" id="loginTab">Sign In</button>
            <button class="auth-tab" id="signupTab">Sign Up</button>
        </div>
        
        <div id="auth-status"></div>
        
        <!-- Login Form -->
        <form id="loginForm" class="auth-form active">
            <label for="loginEmail" class="visually-hidden">Organization Email</label>
            <input type="email" id="loginEmail" placeholder="Organization Email" required>
            <label for="loginPassword" class="visually-hidden">Password</label>
            <input type="password" id="loginPassword" placeholder="Password" required>
            <button type="submit">Sign In</button>
            <div class="auth-divider">OR</div>
            <button type="button" class="google-signin-btn" id="googleSignInBtn">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google logo">
                Sign in with Google
            </button>
        </form>
        
        <!-- Signup Container -->
        <div id="signupContainer" class="auth-form" style="display: none;">
            <!-- Step 1: Role Selection -->
            <div id="roleStep" style="width: 100%;">
                <div class="role-selection" style="display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1rem;">
                    <label for="role" style="font-weight: 500; color: #4a5568;">Select your role to continue:</label>
                    <select id="role" name="role" style="padding: 0.8rem 1rem; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 1rem; background-color: white;">
                        <option value="admin">Admin</option>
                        <option value="authority">Authority</option>
                    </select>
                </div>
                <button type="button" id="roleContinueBtn">Continue</button>
            </div>

            <!-- Step 2: Credentials -->
            <form id="credentialsStep" style="display: none; flex-direction: column; gap: 1rem; width: 100%;">
                <label for="signupEmail" class="visually-hidden">Your Email</label>
                <input type="email" id="signupEmail" placeholder="Your Email" required>
                <label for="signupPassword" class="visually-hidden">Create Password</label>
                <input type="password" id="signupPassword" placeholder="Create Password" required>
                <button type="submit">Sign Up</button>
                <div class="auth-divider">OR</div>
                <button type="button" class="google-signin-btn" id="googleSignUpBtn">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google logo">
                    Sign up with Google
                </button>
                <button type="button" id="backToRoleBtn" style="background: #a0aec0; margin-top: 1rem;">Back</button>
            </form>
        </div>
    </div>

</body>
</html>
