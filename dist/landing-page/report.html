<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Incident - SafePin</title>
    <link rel="preload" href="https://fonts.gstatic.com/s/roboto/v48/KFO7CnqEu92Fr1ME7kSn66aGLdTylUAMa3yUBHMdazQ.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="https://fonts.gstatic.com/s/roboto/v48/KFO7CnqEu92Fr1ME7kSn66aGLdTylUAMaxKUBHMdazTgWw.woff2" as="font" type="font/woff2" crossorigin>
  <script type="module" crossorigin src="/assets/report-BH2OkVfn.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="/assets/footer-BKgixQtT.js">
  <link rel="modulepreload" crossorigin href="/assets/browser-Cx9Z-D_s.js">
  <link rel="modulepreload" crossorigin href="/assets/map-loader-Bcj24iLN.js">
  <link rel="modulepreload" crossorigin href="/assets/errorHandler-CxKsmf1R.js">
  <link rel="modulepreload" crossorigin href="/assets/firebase-ByQbh0Mr.js">
  <link rel="stylesheet" crossorigin href="/assets/footer-HnW0g57N.css">
  <link rel="stylesheet" crossorigin href="/assets/auth-styles-CKdps9dl.css">
</head>
<body>
    <!-- Header Container -->
    <div id="header-container"></div>

    <section class="page-title-section">
        <div class="container">
            <h1>Report an Incident</h1>
            <p class="subtitle">Help keep your community safe by reporting incidents anonymously.</p>
        </div>
    </section>

    <div class="container">
        <form id="report-form" class="report-form">
            <div class="form-group" data-field="incidentType">
                <label for="incidentType">Incident Type <span class="required">*</span></label>
                <select id="incidentType" name="incidentType" required aria-required="true">
                    <option value="">Select incident type</option>
                    <option value="theft">Theft</option>
                    <option value="harassment">Harassment</option>
                    <option value="assault">Assault</option>
                    <option value="vandalism">Vandalism</option>
                    <option value="suspicious">Suspicious Activity</option>
                </select>
                <div id="incidentType-error" class="validation-feedback"></div>
            </div>

            <div class="form-group" data-field="severity">
                <label for="severity">Severity Level <span class="required">*</span></label>
                <select id="severity" name="severity" required aria-required="true">
                    <option value="">Select severity level</option>
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                </select>
                <div id="severity-error" class="validation-feedback"></div>
            </div>

            <div class="form-group" data-field="location">
                <label for="location">Location <span class="required">*</span></label>
                <div class="map-area">
                    <div class="map-address-bar">
                        <span id="address-display">Select a location on the map</span>
                    </div>
                    <div id="map" role="application" aria-label="Interactive map to select incident location"></div>
                    <button type="button" id="current-location-btn" class="current-location-btn" aria-label="Use current location">
                        <img src="data:image/svg+xml,%3csvg%20xmlns='http://www.w3.org/2000/svg'%20xmlns:xlink='http://www.w3.org/1999/xlink'%20width='1080'%20zoomAndPan='magnify'%20viewBox='0%200%20810%20809.999993'%20height='1080'%20preserveAspectRatio='xMidYMid%20meet'%20version='1.0'%3e%3cpath%20fill='%234caf4f'%20d='M%20482.511719%20810.800781%20L%20810.335938%200.359375%20L%20-0.140625%20328.136719%20L%20377.828125%20432.859375%20Z%20M%20482.511719%20810.800781%20'%20fill-opacity='1'%20fill-rule='nonzero'/%3e%3c/svg%3e" alt="Current Location" class="location-icon">
                        Use Current Location
                    </button>
                </div>
                <input type="hidden" id="location" name="location">
                <div id="location-error" class="validation-feedback"></div>
            </div>

            <div class="form-group" data-field="description">
                <label for="description">Description (Optional)</label>
                <textarea id="description" name="description" rows="4" maxlength="500" 
                    placeholder="Provide additional details about the incident"
                    aria-label="Incident description"></textarea>
                <div class="character-count">0/500</div>
                <div id="description-error" class="validation-feedback"></div>
            </div>

            <div class="form-group" data-field="image">
                <label for="image-upload">Upload Image (Optional)</label>
                <div class="file-upload-container">
                    <input type="file" id="image-upload" name="image" accept="image/*"
                        aria-label="Upload an image of the incident"
                        title="Choose an image to upload">
                    <p>Drop image here or click to upload</p>
                    <p class="file-info">Maximum size: 5MB</p>
                </div>
                <div class="file-upload-preview">
                    <img id="image-preview" alt="" class="hidden">
                </div>
                <div id="image-error" class="validation-feedback"></div>
            </div>

            <button type="submit" id="submit-report" class="btn btn-primary">Submit Report</button>
        </form>
    </div>

    <!-- Footer Container -->
    <div id="footer-container"></div>

</body>
</html>
