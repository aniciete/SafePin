<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - SafePin</title>
    <link rel="stylesheet" href="/landing-page/style.css">
    <style>
        .error-container {
            text-align: center;
            padding: 4rem 2rem;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .error-code {
            font-size: 6rem;
            font-weight: bold;
            color: var(--color-primary);
            margin-bottom: 1rem;
        }
        
        .error-message {
            font-size: 1.5rem;
            color: var(--color-text-primary);
            margin-bottom: 2rem;
        }
        
        .error-description {
            color: var(--color-text-secondary);
            margin-bottom: 2rem;
        }
        
        .error-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }
        
        .error-actions .btn {
            min-width: 150px;
        }
    </style>
</head>
<body>
    <!-- Header Container -->
    <div id="header-container"></div>

    <main>
        <div class="error-container">
            <div class="error-code">404</div>
            <h1 class="error-message">Page Not Found</h1>
            <p class="error-description">
                The page you're looking for doesn't exist or has been moved.
                Please check the URL or use the navigation below to find what you're looking for.
            </p>
            <div class="error-actions">
                <a href="/" class="btn btn-primary">Go Home</a>
                <a href="javascript:history.back()" class="btn">Go Back</a>
            </div>
        </div>
    </main>

    <!-- Footer Container -->
    <div id="footer-container"></div>

    <!-- Module Scripts -->
    <script type="module">
        import { SafePinHeader } from './modules/header.js';
        import { SafePinFooter } from './modules/footer.js';
        
        // Initialize header and footer
        const header = new SafePinHeader();
        const footer = new SafePinFooter();
        
        document.getElementById('header-container').innerHTML = header.generateHeader();
        document.getElementById('footer-container').innerHTML = footer.generateFooter();
    </script>
</body>
</html>
