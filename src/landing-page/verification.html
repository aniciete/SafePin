<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Report Status - SafePin</title>
    <link rel="stylesheet" href="/landing-page/style.css">
    <link rel="stylesheet" href="/landing-page/verification-styles.css">
</head>
<body>

    <!-- Header Container -->
    <div id="header-container"></div>

    <section class="page-title-section">
        <div class="container">
            <h1>Check Report Status</h1>
        </div>
    </section>

    <section class="verification-form-section">
        <div class="verification-form-card">
            <div class="verification-form-header">
                <span class="icon">🔎</span>
                <h2>Enter Your Report ID</h2>
            </div>
            <form id="verificationForm">
                <div class="form-group">
                    <label for="reportId">Report ID</label>
                    <input type="text" id="reportId" name="reportId" placeholder="Enter your report ID" required>
                </div>
                <div class="submit-button-container">
                    <button type="submit" class="btn btn-primary-green">
                        <span class="btn-text">Check Status</span>
                        <div class="loading-spinner hidden"></div>
                    </button>
                </div>
            </form>
        </div>
    </section>

    <section id="status-display-section" class="hidden">
        <div class="status-display-card">
            <div class="status-display-header">
                <span class="icon">📊</span>
                <h2>Report Status</h2>
            </div>
            <div id="status-details">
                <!-- Status details will be populated by JavaScript -->
            </div>
        </div>
    </section>

    <!-- Footer Container -->
    <div id="footer-container"></div>

    <!-- Module Scripts -->
    <script type="module" src="/modules/header.js"></script>
    <script type="module" src="/modules/footer.js"></script>
    <script type="module" src="/landing-page/verification.js"></script>

</body>
</html>
