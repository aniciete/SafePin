# GitHub Actions CI/CD Pipeline for SafePin

name: SafePin CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run linters
      run: npm run lint

    - name: Run unit and integration tests
      run: npm run test -- --run

    - name: Build project
      run: npm run build

    - name: Run E2E tests
      uses: cypress-io/github-action@v5
      with:
        start: npm run serve
        wait-on: 'http://localhost:4173' # Default port for vite preview
        browser: chrome