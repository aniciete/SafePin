<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafePin - Authority Access</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="modules/auth-styles.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <h1>Authority Access Portal</h1>
            <p>Sign in with your organization account</p>
        </div>
        
        <div id="auth-status"></div>
        
        <!-- Login Form -->
        <form id="loginForm" class="auth-form" onsubmit="event.preventDefault(); handleLogin();">
            <input type="email" id="loginEmail" placeholder="Organization Email" required>
            <input type="password" id="loginPassword" placeholder="Password" required>
            <button type="submit">Sign In</button>
            <div class="auth-divider">OR</div>
            <button type="button" class="google-signin-btn" onclick="handleGoogleSignIn()">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google logo">
                Sign in with Google
            </button>
        </form>

        <script type="module">
            import { auth } from './modules/firebase-init.js';
            import { 
                signInWithEmailAndPassword,
                GoogleAuthProvider,
                signInWithPopup
            } from 'https://www.gstatic.com/firebasejs/9.6.0/firebase-auth.js';

            // Login handler
            window.handleLogin = async () => {
                const email = document.getElementById('loginEmail').value;
                const password = document.getElementById('loginPassword').value;
                
                try {
                    await signInWithEmailAndPassword(auth, email, password);
                    window.location.href = 'authority-page/index.html';
                } catch (error) {
                    document.getElementById('auth-status').textContent = 'Authentication failed. Please use your organization credentials.';
                }
            };

            // Google Sign-In handler
            window.handleGoogleSignIn = async () => {
                const provider = new GoogleAuthProvider();
                
                try {
                    await signInWithPopup(auth, provider);
                    window.location.href = 'authority-page/index.html';
                } catch (error) {
                    document.getElementById('auth-status').textContent = 'Google sign-in failed. Please try again.';
                }
            };
        </script>
    </div>
</body>
</html>
